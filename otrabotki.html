<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#6C3FC5">
<title>Отработки · Speak&Smile</title>
<style>
:root{--p:#6C3FC5;--p2:#8B5CF6;--gold:#F5C842;--ink:#1A1A2E;--mut:#6b6785;--line:#e7e2f2;--bg:#f6f4fb;--card:#fff;--green:#16A34A;--red:#DC2626;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;--mono:ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:16px;padding-bottom:40px}
header{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:16px}
header h1{margin:0;font-size:19px;font-weight:800}
header .sub{font-size:12px;opacity:.9;margin-top:3px}
.tabs{display:flex;gap:8px;margin:14px 14px 0}
.tabs button{flex:1;border:none;border-radius:14px 14px 0 0;padding:12px;font-family:var(--font);font-size:14px;font-weight:800;cursor:pointer;background:#e9e3f6;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--p)}
.wrap{padding:0 14px}
.pane{background:var(--card);border-radius:0 0 16px 16px;padding:12px;min-height:40vh}
.total{font-size:13px;color:var(--mut);margin:2px 0 12px}
.total b{color:var(--ink)}

.slot{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.slot>.hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;background:#faf8ff}
.slot .lbl{font-weight:800;font-size:15px;flex:1}
.badge{min-width:26px;height:26px;padding:0 8px;border-radius:20px;background:var(--p);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.badge.come{background:var(--green)}
.chev{color:var(--mut);font-size:13px}
.slot .body{display:none;padding:4px 0 8px}
.slot.open .body{display:block}

.stu{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.stu .mid{flex:1;min-width:0}
.stu .nm{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.stu .nm .nmtext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.stu .nm .cnt{flex:none;background:var(--gold);color:var(--ink);border-radius:8px;padding:1px 6px;font-size:11px;font-weight:800}
.stu .meta{font-size:11px;color:var(--mut)}
.stu .btns{display:flex;gap:5px;flex:none}
.mbtn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;color:var(--mut)}
.mbtn.come.on{background:var(--green);border-color:var(--green);color:#fff}
.mbtn.no.on{background:var(--mut);border-color:var(--mut);color:#fff}

.pay{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.pay .d{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--p);flex:none;width:52px}
.pay .pl{flex:1;font-size:14px;font-weight:600}
.pay .gdet{border-bottom:1px solid var(--line)}
.gdet summary{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.gname{font-size:14px;font-weight:700}
.gsub{font-size:11.5px;color:var(--mut)}
.mstu{display:flex;gap:10px;align-items:baseline;justify-content:space-between;padding:7px 14px 7px 24px;border-top:1px dashed var(--line);flex-wrap:wrap}
.mnm{font-size:13px;font-weight:600;min-width:150px}
.mdays{font-size:12px;color:#4a4a58;text-align:right}
.day{white-space:nowrap}
.day.ok{color:#0a7a68;font-weight:700}
.wsel{font-family:inherit;font-size:13px;padding:7px 10px;border-radius:12px;border:1.5px solid var(--line);background:#fff}
.rephd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.repsub{font-size:11.5px;color:var(--mut);margin-top:2px}
.repsum{padding:8px 14px;font-size:12.5px;color:var(--mut)}
.prt{font-family:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:18px;border:1.5px solid var(--purple);background:#fff;color:var(--purple);cursor:pointer}
table.rep{width:100%;border-collapse:collapse;font-size:12.5px}
table.rep th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);padding:6px 8px;border-bottom:1.5px solid var(--line)}
table.rep td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.rep tr.nd td:last-child{color:#c0392b;font-weight:600}
table.rep tr.d td:last-child{color:#0a7a68;font-weight:600}
@media print{
  header,.tabs,.prt,#paneL,#paneP{display:none!important}
  body{background:#fff}
  .wrap{padding:0}
  table.rep{font-size:11px}
  .rephd{border:none;padding:0 0 8px}
}
.noresp{color:#E8740A;font-weight:700}
.plwho{font-size:11.5px;color:#4a4a58;margin-top:2px;line-height:1.35}
.plsub{font-size:11px;color:var(--mut)}
.pay .amt{font-family:var(--mono);font-weight:800;font-size:15px;flex:none}
.pay.ok .amt{color:var(--green)}.pay.no .amt{color:var(--mut)}
.mhd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:16px 2px 8px;padding-bottom:6px;border-bottom:2px solid var(--p)}
.mhd .mnm{font-size:16px;font-weight:800;text-transform:capitalize;color:var(--p)}
.mhd .msum{font-family:var(--mono);font-size:17px;font-weight:800}
.mhd:first-child{margin-top:2px}
.paytot{margin-top:12px;padding:14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:14px;text-align:center}
.paytot .v{font-family:var(--mono);font-size:26px;font-weight:800}
.paytot .l{font-size:12px;opacity:.9}

.empty{color:var(--mut);font-size:13px;text-align:center;padding:24px}
.gate{margin:40px 16px;background:var(--card);border-radius:16px;padding:22px;text-align:center}
.gate input{width:100%;font-size:18px;text-align:center;font-family:var(--mono);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.gate button{background:var(--p);color:#fff;border:none;border-radius:12px;padding:13px 22px;font-weight:800;font-size:15px;cursor:pointer}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:16px}
.refresh{background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
</style>
</head>
<body>

<div id="gate" class="gate" hidden>
  <div style="font-size:16px;font-weight:800;margin-bottom:4px">🔁 Отработки</div>
  <div style="font-size:13px;color:var(--mut)">Введите код доступа</div>
  <input id="code" inputmode="text" autocapitalize="none" autocomplete="off" placeholder="код">
  <div><button onclick="saveCode()">Войти</button></div>
</div>

<div id="app" hidden>
  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div>
        <h1>🔁 Отработки</h1>
        <div class="sub" id="dataAt">…</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <button class="refresh" onclick="load()">Обновить</button>
        <button class="refresh" id="btnCollect" onclick="collectNow()" title="Заново прочитать посещаемость в BigBen (3–5 минут)">🔄 Собрать из BigBen</button>
      </div>
    </div>
  </header>
  <div class="tabs">
    <button id="tabL" class="on" onclick="showTab('L')">📋 Списки (обзвон)</button>
    <button id="tabP" onclick="showTab('P')">💰 Оплата</button>
    <button id="tabR" onclick="showTab('R')">📄 Сводка недели</button>
    <button id="tabM" onclick="showTab('M')">🗓 Месяц</button>
  </div>
  <div class="wrap">
    <div id="paneL" class="pane"></div>
    <div id="paneP" class="pane" hidden></div>
    <div id="paneR" class="pane" hidden></div>
    <div id="paneM" class="pane" hidden></div>
    <div class="foot">Speak&amp;Smile · отработки · педагог Инга. «Был» отмечается в BigBen, тут — обзвон и оплата.</div>
  </div>
</div>

<script>
"use strict";
var WORKER="https://ss-bb.o-sintsova.workers.dev";
var el=function(t,p,kids){var e=document.createElement(t);if(p)for(var k in p){if(k==="class")e.className=p[k];else if(k==="text")e.textContent=p[k];else if(k.slice(0,2)==="on")e[k.toLowerCase()]=p[k];else e.setAttribute(k,p[k]);}(kids||[]).forEach(function(c){if(c)e.appendChild(c);});return e;};
var DATA=null, MARKS={};
function token(){return localStorage.getItem("bbToken")||"";}
function fmtDate(s){if(!s)return"";var p=s.split("-");return p[2]+"."+p[1];}
function fmtDT(s){try{var d=new Date(s);return d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return"";}}

// Пересбор из BigBen прямо со страницы: вход (до 1,5 мин) + сбор посещаемости (3–4 мин).
// Нужен, потому что GitHub запускает расписание с задержкой, а данные бывают нужны сразу.
function collectNow(){
  var b=document.getElementById("btnCollect"), at=document.getElementById("dataAt");
  if(b.disabled) return;
  b.disabled=true; var was=b.textContent;
  var tick=function(t){b.textContent=t;};
  var go=function(what,ms){return fetch(WORKER+"/tick-7a3f9c2e51?do="+what+"&t="+encodeURIComponent(token()),{cache:"no-store"}).then(function(r){return r.json();});};
  tick("Вход в BigBen…");
  go("warm").then(function(w){
    if(!w||!w.ok) throw new Error((w&&w.error)||"BigBen не пустил");
    tick("Собираю посещаемость… 3–4 мин");
    return go("otr");
  }).then(function(o){
    if(!o||!o.ok) throw new Error((o&&o.error)||"сбор не прошёл");
    b.textContent="✅ Готово"; load();
    if(o.failedGroups) at.textContent += " · BigBen отдал не все группы ("+o.failedGroups+") — очередь оставлена прошлая";
    setTimeout(function(){b.textContent=was;b.disabled=false;},4000);
  }).catch(function(e){
    b.textContent="⚠️ "+(e.message||"не вышло");
    setTimeout(function(){b.textContent=was;b.disabled=false;},6000);
  });
}
function saveCode(){var v=document.getElementById("code").value.trim();if(v){localStorage.setItem("bbToken",v);boot();}}
function boot(){
  if(!token()){document.getElementById("gate").hidden=false;document.getElementById("app").hidden=true;return;}
  document.getElementById("gate").hidden=true;document.getElementById("app").hidden=false;load();
}
function load(){
  document.getElementById("paneL").textContent="Загрузка…";
  fetch(WORKER+"/otr-data?t="+encodeURIComponent(token()),{cache:"no-store"})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.ok){document.getElementById("paneL").textContent=(d.error||"ошибка")+" — проверьте код";return;}
      DATA=d;MARKS=d.marks||{};
      document.getElementById("dataAt").textContent = d.at?("данные на "+fmtDT(d.at)):"нет данных — сбор ещё не запускался";
      renderLists();renderPay();
    })
    .catch(function(){document.getElementById("paneL").textContent="нет связи с сервером";});
}
function showTab(t){
  document.getElementById("tabL").className=t==="L"?"on":"";
  document.getElementById("tabP").className=t==="P"?"on":"";
  document.getElementById("tabR").className=t==="R"?"on":"";
  document.getElementById("tabM").className=t==="M"?"on":"";
  document.getElementById("paneL").hidden=t!=="L";
  document.getElementById("paneP").hidden=t!=="P";
  document.getElementById("paneR").hidden=t!=="R";
  document.getElementById("paneM").hidden=t!=="M";
  if(t==="R")renderReport();
  if(t==="M")renderMonth();
}

// СВОДКА НЕДЕЛИ: по группам — кто пропустил, когда, по какой причине и отработал ли. Для печати.
// Недели хранятся в архиве на сервере (/otr-reports), можно посмотреть любую прошлую.
var ARCH=null, ARCHWEEK=null;
function renderReport(){
  var pane=document.getElementById("paneR");pane.textContent="";
  if(!ARCH){
    pane.appendChild(el("div",{class:"empty",text:"Загрузка архива…"}));
    fetch(WORKER+"/otr-reports?t="+encodeURIComponent(token()),{cache:"no-store"})
      .then(function(r){return r.json();})
      .then(function(d){ARCH=(d&&d.all)||{};renderReport();})
      .catch(function(){ARCH={};renderReport();});
    return;
  }
  var weeks=Object.keys(ARCH).sort().reverse();
  if(DATA&&DATA.week&&weeks.indexOf(DATA.week)<0)weeks.unshift(DATA.week);
  if(!ARCHWEEK||weeks.indexOf(ARCHWEEK)<0)ARCHWEEK=(DATA&&DATA.week)||weeks[0];
  var cur=(DATA&&ARCHWEEK===DATA.week)?{week:DATA.week,at:DATA.at,report:DATA.report||[]}:(ARCH[ARCHWEEK]||{report:[]});
  var rep=cur.report||[];
  var sel=el("select",{class:"wsel",onChange:function(){ARCHWEEK=this.value;renderReport();}});
  weeks.forEach(function(w){
    var o=el("option",{value:w,text:weekLabel(w)+((DATA&&w===DATA.week)?" (текущая)":"")});
    if(w===ARCHWEEK)o.selected=true;
    sel.appendChild(o);
  });
  var head=el("div",{class:"rephd"},[
    el("div",{},[el("b",{text:"Отработки за неделю"}),el("div",{class:"repsub",text:"данные "+(cur.at?fmtDT(cur.at):"—")})]),
    el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},[sel,
      el("button",{class:"prt",text:"🖨 Печать",onClick:function(){window.print();}})])
  ]);
  pane.appendChild(head);
  if(!rep.length){pane.appendChild(el("div",{class:"empty",text:"За эту неделю пропусков нет"}));return;}
  var tot=0,done=0;
  rep.forEach(function(g){g.students.forEach(function(s){tot++;if(s.done)done++;});});
  pane.appendChild(el("div",{class:"repsum",text:"Неделя "+weekLabel(ARCHWEEK)+" · пропустили: "+tot+" · отработали: "+done+" · осталось: "+(tot-done)}));
  var tbl=el("table",{class:"rep"});
  var thead=el("thead",{},[el("tr",{},[
    el("th",{text:"Группа"}),el("th",{text:"Ученик"}),el("th",{text:"Пропуски"}),el("th",{text:"Причина"}),el("th",{text:"Отработал"})
  ])]);
  tbl.appendChild(thead);
  var tb=el("tbody");
  rep.forEach(function(g){
    g.students.forEach(function(s,i){
      var dates=(s.dates||[]).map(fmtDate).join(", ");
      var whys=(s.dates||[]).map(function(d){return (s.why&&s.why[d]==="n")?"неоплач.":"уваж.";});
      var uniq=whys.filter(function(v,ix,a){return a.indexOf(v)===ix;}).join(" / ");
      tb.appendChild(el("tr",{class:s.done?"d":"nd"},[
        el("td",{text:i===0?g.group:""}),
        el("td",{text:s.fio}),
        el("td",{text:dates}),
        el("td",{text:uniq}),
        el("td",{text:s.done?("да, "+fmtDate(s.doneDate)):"нет"})
      ]));
    });
  });
  tbl.appendChild(tb);
  pane.appendChild(tbl);
}
// КАРТИНА МЕСЯЦА: группы сворачиваются, внутри — дети, их пропуски (с причиной) и что отработано.
var MON=null, MONKEY=null;
function renderMonth(){
  var pane=document.getElementById("paneM");pane.textContent="";
  if(!MON){
    pane.appendChild(el("div",{class:"empty",text:"Загрузка…"}));
    fetch(WORKER+"/otr-months?t="+encodeURIComponent(token()),{cache:"no-store"})
      .then(function(r){return r.json();}).then(function(d){MON=(d&&d.all)||{};renderMonth();})
      .catch(function(){MON={};renderMonth();});
    return;
  }
  var ms=Object.keys(MON).sort().reverse();
  if(!ms.length){pane.appendChild(el("div",{class:"empty",text:"Данных пока нет"}));return;}
  if(!MONKEY||ms.indexOf(MONKEY)<0)MONKEY=ms[0];
  var cur=MON[MONKEY]||{groups:[]};
  var sel=el("select",{class:"wsel",onChange:function(){MONKEY=this.value;renderMonth();}});
  ms.forEach(function(m){var o=el("option",{value:m,text:monthName(m)});if(m===MONKEY)o.selected=true;sel.appendChild(o);});
  pane.appendChild(el("div",{class:"rephd"},[
    el("div",{},[el("b",{text:"Пропуски и отработки за месяц"}),el("div",{class:"repsub",text:"данные "+(cur.at?fmtDT(cur.at):"—")})]),
    el("div",{style:"display:flex;gap:8px;align-items:center;flex-wrap:wrap"},[sel,el("button",{class:"prt",text:"🖨 Печать",onClick:function(){window.print();}})])
  ]));
  var tk=0,td=0,tm=0;
  cur.groups.forEach(function(g){g.students.forEach(function(s){tk++;tm+=s.misses;td+=s.done;});});
  pane.appendChild(el("div",{class:"repsum",text:"Детей с пропусками: "+tk+" · пропусков: "+tm+" · отработано: "+td+" ("+(tm?Math.round(td/tm*100):0)+"%)"}));
  cur.groups.forEach(function(g){
    var miss=0,done=0;g.students.forEach(function(s){miss+=s.misses;done+=s.done;});
    var det=el("details",{class:"gdet"});
    det.appendChild(el("summary",{},[
      el("span",{class:"gname",text:g.group}),
      el("span",{class:"gsub",text:g.students.length+" чел. · "+miss+" пропусков · отработано "+done})
    ]));
    g.students.forEach(function(s){
      var line=el("div",{class:"mstu"},[
        el("div",{class:"mnm",text:s.fio}),
        el("div",{class:"mdays"})
      ]);
      var wrap=line.querySelector(".mdays");
      s.days.forEach(function(d,i){
        if(i)wrap.appendChild(document.createTextNode(" "));
        wrap.appendChild(el("span",{class:"day"+(d.done?" ok":"")+(d.why==="n"?" noresp":""),
          text:fmtDate(d.date)+(d.done?" ✓":"")+(d.why==="n"?" (неоплач.)":"")}));
      });
      det.appendChild(line);
    });
    pane.appendChild(det);
  });
}
function monthName(m){var M=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];return M[+m.slice(5,7)-1]+" "+m.slice(0,4);}
function weekLabel(w){
  var a=new Date(w+"T00:00:00"),b=new Date(a.getTime()+6*864e5);
  var f=function(d){return ("0"+d.getDate()).slice(-2)+"."+("0"+(d.getMonth()+1)).slice(-2);};
  return f(a)+" — "+f(b);
}

function mark(uid,m){
  var cur=MARKS[uid]===m?"clear":m;
  MARKS[uid]=cur==="clear"?undefined:cur;
  fetch(WORKER+"/otr-mark?t="+encodeURIComponent(token())+"&uid="+uid+"&mark="+(cur==="clear"?"clear":cur),{cache:"no-store"});
  renderLists();
}

function renderLists(){
  var pane=document.getElementById("paneL");pane.textContent="";
  if(!DATA){pane.textContent="…";return;}
  var q=DATA.queue||{}, order=DATA.order||Object.keys(q), labels=DATA.labels||{};
  var levels=order.filter(function(lk){return q[lk]&&q[lk].length;});
  var total=0,come=0,lessons=0;
  levels.forEach(function(lk){q[lk].forEach(function(s){total++;lessons+=(s.dates&&s.dates.length)||1;if(MARKS[s.user_id]==="come")come++;});});
  if(!total){pane.appendChild(el("div",{class:"empty",text:"Очередь пуста — все отработали или пропусков нет 🎉"}));return;}
  pane.appendChild(el("div",{class:"total"},[document.createTextNode("В очереди: "),el("b",{text:total+" учен."}),document.createTextNode(" · "),el("b",{text:lessons+" урок."}),document.createTextNode(" · подтвердили «придёт»: "),el("b",{text:String(come)})]));
  levels.forEach(function(lk){
    var list=q[lk];
    var comeN=list.filter(function(s){return MARKS[s.user_id]==="come";}).length;
    var body=el("div",{class:"body"});
    list.forEach(function(s){
      var cm=MARKS[s.user_id];
      var bCome=el("button",{class:"mbtn come"+(cm==="come"?" on":""),text:"придёт",onClick:function(){mark(s.user_id,"come");}});
      var bNo=el("button",{class:"mbtn no"+(cm==="no"?" on":""),text:"не придёт",onClick:function(){mark(s.user_id,"no");}});
      var ds=(s.dates&&s.dates.length)?s.dates:(s.date?[s.date]:[]);
      var n=ds.length;
      // причина из CRM: «Пропуск» (код 1) = уважительная, «Неоплачиваемый пропуск» (код 2) = нет — оранжевым
      var why=s.why||{};
      var meta=el("div",{class:"meta"},[document.createTextNode(s.group+" · "+(n>1?(n+" урока: "):"пропустил "))]);
      ds.forEach(function(d,idx){
        if(idx)meta.appendChild(document.createTextNode(", "));
        meta.appendChild(el("span",{class:(why[d]==="n"?"noresp":""),text:fmtDate(d)+(why[d]==="n"?" (неоплач.)":"")}));
      });
      var nm=el("div",{class:"nm"},[el("span",{class:"nmtext",text:s.fio})]);
      if(n>1)nm.appendChild(el("span",{class:"cnt",text:"×"+n}));
      body.appendChild(el("div",{class:"stu"},[
        el("div",{class:"mid"},[nm,meta]),
        el("div",{class:"btns"},[bCome,bNo])
      ]));
    });
    var badge=el("div",{class:"badge"+(comeN?" come":""),text:comeN?comeN+"/"+list.length:String(list.length)});
    var hd=el("div",{class:"hd"},[el("div",{class:"lbl",text:labels[lk]||lk}),badge,el("div",{class:"chev",text:"▾"})]);
    var slot=el("div",{class:"slot"},[hd,body]);
    hd.onclick=function(){slot.className=slot.className.indexOf("open")<0?"slot open":"slot";};
    pane.appendChild(slot);
  });
}

var MONTHS=["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
function monthName(ym){var p=ym.split("-");return MONTHS[+p[1]-1]+" "+p[0];}
// 90-минутные уровни (старшие): Get Involved, Prepare, Gateway → 2250 ₽; остальные 60 мин → 1500 ₽
var OTR90={GI1:1,GI2:1,P3:1,P4:1,P5:1,GW:1};
function rateFor(lk){return OTR90[lk]?2250:1500;}
function rub(n){return n.toLocaleString("ru-RU")+" ₽";}
function renderPay(){
  var pane=document.getElementById("paneP");pane.textContent="";
  if(!DATA){return;}
  var pl=(DATA.payLessons||[]).slice();
  if(!pl.length){pane.appendChild(el("div",{class:"empty",text:"Отработок пока нет"}));return;}
  pane.appendChild(el("div",{class:"total"},[document.createTextNode("Ставка Инги: "),el("b",{text:"1 500 ₽ (60 мин) · 2 250 ₽ (90 мин)"})]));
  // группировка по месяцам, новый месяц сверху
  var byM={};
  pl.forEach(function(p){var ym=(p.date||"").slice(0,7);(byM[ym]=byM[ym]||[]).push(p);});
  var months=Object.keys(byM).sort().reverse();
  months.forEach(function(ym){
    var rows=byM[ym].slice().sort(function(a,b){return (a.date+a.lk).localeCompare(b.date+b.lk);});
    var mTot=0;
    rows.forEach(function(p){if(p.conducted)mTot+=rateFor(p.lk);});
    pane.appendChild(el("div",{class:"mhd"},[
      el("div",{class:"mnm",text:monthName(ym)}),
      el("div",{class:"msum",text:rub(mTot)})
    ]));
    rows.forEach(function(p){
      var ok=p.conducted,r=rateFor(p.lk);
      pane.appendChild(el("div",{class:"pay "+(ok?"ok":"no")},[
        el("div",{class:"d",text:fmtDate(p.date)}),
        el("div",{class:"pl"},[document.createTextNode(p.label),
          el("div",{class:"plsub",text:ok?("пришло: "+p.attendees+" · "+(r===2250?"90":"60")+" мин"):"не состоялась / не отмечено"}),
          (ok&&p.who&&p.who.length)?el("div",{class:"plwho",text:p.who.join(", ")}):null]),
        el("div",{class:"amt",text:ok?rub(r):"—"})
      ]));
    });
  });
}

boot();
</script>
